name: Build Android APK (Flutter)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: miss_net
        run: flutter pub get

      - name: Build Release APK
        working-directory: miss_net
        run: |
          flutter build apk --release
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/MissNet-release.apk || cp build/app/outputs/flutter-apk/*.apk ../dist/MissNet-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissNet-Flutter-APK-${{ github.run_number }}
          path: dist/MissNet-release.apk
          retention-days: 14

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: MissNet (Latest Flutter Release)
          draft: false
          prerelease: false
          make_latest: true
          files: dist/MissNet-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
