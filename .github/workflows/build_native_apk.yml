name: Build Native APK (MissNet Native)

on:
  push:
    branches:
      - main
    paths:
      - 'miss_net_native/**'
      - '.github/workflows/build_native_apk.yml'
  pull_request:
    paths:
      - 'miss_net_native/**'
      - '.github/workflows/build_native_apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate new debug signing key
        working-directory: miss_net_native
        run: |
          mkdir -p app
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias missnet-debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass MissNet2026 \
            -keypass MissNet2026 \
            -dname "CN=miss_net, OU=dev, O=miss_net, L=SH, ST=SH, C=CN" -noprompt
          cat > app/signing.properties << 'EOF'
          keystore=app/debug.keystore
          keystore_password=MissNet2026
          key_alias=missnet-debug
          key_password=MissNet2026
          EOF

      - name: Grant execute permission for gradlew
        working-directory: miss_net_native
        run: chmod +x gradlew

      - name: Assemble Debug APK
        working-directory: miss_net_native
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ../build.log
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/MissNet-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissNet-Debug-APK-${{ github.run_number }}
          path: dist/MissNet-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: MissNet Native (Latest Build)
          draft: false
          prerelease: false
          make_latest: true
          files: dist/MissNet-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug-log
          git add -f build.log
          git commit -m "ci: build failure log"
          git push -f origin ci-debug-log
