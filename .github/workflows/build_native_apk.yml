name: Build Native APK (MissNet Native)

on:
  push:
    branches:
      - main
    paths:
      - 'miss_net_native/**'
      - '.github/workflows/build_native_apk.yml'
  pull_request:
    paths:
      - 'miss_net_native/**'
      - '.github/workflows/build_native_apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate new debug signing key
        working-directory: miss_net_native
        run: |
          mkdir -p app
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias missnet-debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass MissNet2026 \
            -keypass MissNet2026 \
            -dname "CN=miss_net, OU=dev, O=miss_net, L=SH, ST=SH, C=CN" -noprompt
          cat > app/signing.properties << 'EOF'
          keystore=app/debug.keystore
          keystore_password=MissNet2026
          key_alias=missnet-debug
          key_password=MissNet2026
          EOF

      - name: Grant execute permission for gradlew
        working-directory: miss_net_native
        run: chmod +x gradlew

      - name: Assemble Debug APK
        working-directory: miss_net_native
        run: |
          ./gradlew :app:assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/MissNet-debug.apk
          ls -lh ../dist/MissNet-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissNet-Debug-APK-${{ github.run_number }}
          path: dist/MissNet-debug.apk
          if-no-files-found: warn
          retention-days: 14
