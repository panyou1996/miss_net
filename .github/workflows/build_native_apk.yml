name: Build Native APK (MissNet Native)

on:
  push:
    branches:
      - main
    paths:
      - 'miss_net_native/**'
      - '.github/workflows/build_native_apk.yml'
  pull_request:
    paths:
      - 'miss_net_native/**'
      - '.github/workflows/build_native_apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: miss_net_native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Generate new debug signing key
        run: |
          mkdir -p app
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias missnet-debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass MissNet2026 \
            -keypass MissNet2026 \
            -dname "CN=miss_net, OU=dev, O=miss_net, L=SH, ST=SH, C=CN" -noprompt
          cat > app/signing.properties << 'EOF'
          keystore=app/debug.keystore
          keystore_password=MissNet2026
          key_alias=missnet-debug
          key_password=MissNet2026
          EOF
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint Debug
        run: ./gradlew :app:lintDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: missnet-native-debug-apk-${{ github.run_number }}
          path: miss_net_native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report artifact
        uses: actions/upload-artifact@v4
        with:
          name: missnet-native-lint-report-${{ github.run_number }}
          path: miss_net_native/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: missnet-native-failure-logs-${{ github.run_number }}
          path: |
            miss_net_native/app/build/reports/
            miss_net_native/app/build/outputs/
          if-no-files-found: warn
          retention-days: 7
